<text x="52" y="630" class="sub">Short torso and limbs are a deliberate whole-body design.</text>
<text x="637" y="630" class="sub">Target age and build still govern the selected construction.</text>
<line x1="40" y1="682" x2="88" y2="682" class="contour"/>
<text x="100" y="687" class="">Dotted: illustrative hair / garment mass. Do not measure head height or leg length from these contours.</text>
<text x="40" y="718" class="sub">Next: use the target's own depth view and an action pose to check volume, joints and gesture. No universal pass band.</text>
