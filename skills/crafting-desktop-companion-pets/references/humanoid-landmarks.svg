<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Illustrative humanoid construction landmarks</title>
<desc id="desc">Two clothed construction studies, three heads and seven and a half heads tall, share crown and sole levels. These are examples only, not required proportions or approved pets. Head height excludes hair. Pelvis and knees are shown separately from garment hems.</desc>
